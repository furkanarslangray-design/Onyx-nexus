upstream tier1_backend {
    server localhost:8001 max_fails=3 fail_timeout=30s;
    server localhost:8002 max_fails=3 fail_timeout=30s;
}

upstream tier2_backend {
    server localhost:8003 max_fails=3 fail_timeout=30s;
    server localhost:8004 max_fails=3 fail_timeout=30s;
}

upstream tier3_backend {
    server localhost:8005 max_fails=3 fail_timeout=30s;
    server localhost:8006 max_fails=3 fail_timeout=30s;
}

server {
    listen 8000;
    server_name localhost;

    location /v1 {
        # Tier 1: Primary high-capacity endpoints
        proxy_pass http://tier1_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;

        # Circuit breaker: fallback to tier2 on 5xx
        error_page 500 502 503 504 = @tier2_fallback;
    }

    location @tier2_fallback {
        proxy_pass http://tier2_backend;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
