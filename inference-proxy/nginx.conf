upstream tier1_backend {
    server localhost:8001 max_fails=3 fail_timeout=30s;
    server localhost:8002 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream tier2_backend {
    server localhost:8003 max_fails=3 fail_timeout=30s;
    server localhost:8004 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream tier3_backend {
    server localhost:8005 max_fails=3 fail_timeout=30s;
    server localhost:8006 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 8000;
    server_name localhost;

    # Tier 1 with fallback chain: Tier1 -> Tier2 -> Tier3
    location /v1 {
        proxy_pass http://tier1_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        error_page 500 502 503 504 = @fallback_to_tier2;
    }

    location @fallback_to_tier2 {
        proxy_pass http://tier2_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        error_page 500 502 503 504 = @fallback_to_tier3;
    }

    location @fallback_to_tier3 {
        proxy_pass http://tier3_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
